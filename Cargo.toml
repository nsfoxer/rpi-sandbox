[workspace]
members = [
  "crates/rpi-sandbox-core",
  "crates/rpi-sandbox-launcher",
  "crates/rpi-sandbox-extension",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
libc = "0.2"
rpi-plugin-sdk = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
